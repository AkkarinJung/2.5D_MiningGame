<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deepvein 2.5D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1+Code:wght@400;600&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen 2.5D game. Status strip + card deck on top, WebGL dungeon with a 2D text overlay in the middle, log below. Single dark look by design. */
:root{
  --bg:#0e0b0a; --panel:#1a1513; --line:#3a2f29; --fg:#eadfce; --dim:#9b8b7a;
  --lamp:#e0a83a; --gem:#6fdcea; --blood:#d0554f; --xp:#b9e07a;
  --r0:#9b8b7a; --r1:#6fa8e0; --r2:#d58cf0;
  --f-display:"Pixelify Sans", ui-monospace, monospace;
  --f-body:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html:lang(ja){--f-display:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;--f-body:"M PLUS 1 Code","Hiragino Kaku Gothic ProN","Yu Gothic",ui-monospace,monospace}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:13px;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:1180px;margin:0 auto}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--f-display);font-size:20px;color:var(--lamp);margin-right:auto;line-height:1}
.brand small{font-size:11px;color:var(--gem);margin-left:6px}
#clsChip{font-family:var(--f-display);font-size:12px;border:1px solid var(--line);padding:3px 8px;color:var(--lamp)}
.stat{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-weight:400;font-size:11px;color:var(--dim)}
.stat span{font-weight:600}
.bar{width:110px;height:10px;background:#2a1f1c;border:1px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .15s}
.xpb{display:block;width:48px;height:5px;background:#2a1f1c;border:1px solid var(--line)}.xpb b{display:block;height:100%;width:0;background:var(--xp);transition:width .2s}
#sml{color:var(--xp)}
button{font-family:var(--f-display);font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--lamp);color:var(--lamp)}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
#langBtn{color:var(--gem);font-size:12px}
#skBtn{position:relative;overflow:hidden;min-width:110px}
#skBtn::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:left;transform:scaleX(var(--cd,0))}
#skBtn span{position:relative;z-index:1}
#deck{display:flex;gap:6px;flex-wrap:wrap;min-height:22px;align-items:center}
#deck:empty::before{content:attr(data-empty);color:var(--dim);font-size:11px}
.chip{font-size:11px;border:1px solid var(--line);border-left:3px solid var(--rc);padding:2px 6px;background:var(--panel);white-space:nowrap}
.chip em{font-style:normal;color:var(--dim)}
#stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);background:#070505;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:crosshair;touch-action:none}
#fx{pointer-events:none}
.foot{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
#log{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;min-height:56px;font-size:12px;line-height:1.35}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{color:var(--dim);font-size:11px;line-height:1.7}
.keys kbd{font-family:var(--f-body);border:1px solid var(--line);padding:0 4px;color:var(--fg);background:var(--panel)}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:14px;width:116px;height:116px;border-radius:50%;border:2px solid rgba(234,223,206,.22);background:rgba(26,21,19,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(224,168,58,.55)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;padding:0;background:rgba(26,21,19,.6);border:2px solid rgba(234,223,206,.3)}
#tA{right:calc(14px + env(safe-area-inset-right,0px));bottom:22px;width:82px;height:82px}
#tS{right:calc(104px + env(safe-area-inset-right,0px));bottom:14px;width:62px;height:62px;font-size:12px}
#tQ{right:calc(30px + env(safe-area-inset-right,0px));bottom:116px;width:50px;height:50px;font-size:11px}
@media (hover:none){#touch{display:block}.keys{display:none}}
@media (max-width:760px){.stat.opt{display:none}.bar{width:80px}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,5,5,.76);padding:16px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);max-width:420px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--lamp);text-wrap:balance}
.card p,.pick p{margin:0;color:var(--dim);line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;padding:9px 12px}
.pick{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:860px;width:100%;text-align:center;margin:auto}
.odds{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--f-display);font-size:14px}
.hand{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px;width:100%}
@media (max-width:640px){.hand{grid-template-columns:1fr 1fr}}
.cardbtn{--rc:var(--r0);display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;min-height:130px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 16%,var(--panel)),var(--panel) 60%);border:2px solid color-mix(in srgb,var(--rc) 60%,var(--line));
  font-family:var(--f-body);font-size:12px;animation:deal .35s both}
.cardbtn:nth-child(2){animation-delay:.06s}.cardbtn:nth-child(3){animation-delay:.12s}.cardbtn:nth-child(4){animation-delay:.18s}
.cardbtn:hover{border-color:var(--rc);color:var(--fg);transform:translateY(-3px)}
.cardbtn .rar{font-family:var(--f-display);font-size:11px;color:var(--rc);display:flex;justify-content:space-between;width:100%;gap:6px}
.cardbtn .nm{font-family:var(--f-display);font-size:17px;color:var(--fg)}
.cardbtn .ds{color:var(--dim);line-height:1.5}
.cardbtn .own{margin-top:auto;font-size:11px;color:var(--dim)}
.cls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:860px){.cls{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.cls{grid-template-columns:1fr}}
.clsbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;font-family:var(--f-body);font-size:12px;animation:deal .35s both;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.clsbtn:nth-child(2){animation-delay:.05s}.clsbtn:nth-child(3){animation-delay:.1s}.clsbtn:nth-child(4){animation-delay:.15s}
.clsbtn img{width:56px;height:56px;image-rendering:pixelated;background:#241e1b;border:1px solid var(--line)}
.clsbtn .nm{font-family:var(--f-display);font-size:20px;color:var(--fg);display:flex;justify-content:space-between;width:100%}
.clsbtn .nm small{font-size:11px;color:var(--dim)}
.clsbtn .ds{color:var(--dim);line-height:1.5}
.st{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;width:100%;align-items:center;font-size:11px;color:var(--dim)}
.st i{display:block;height:6px;background:#2a1f1c}.st i b{display:block;height:100%;background:var(--lamp)}
.sk{border-top:1px dashed var(--line);padding-top:8px;width:100%;line-height:1.5}
.sk b{font-family:var(--f-display);font-weight:400;color:var(--gem)}
.logo{font-family:var(--f-display);font-size:clamp(30px,6vw,52px);color:var(--lamp);line-height:1;text-shadow:0 3px 0 #5a3d29}
.logo small{display:block;font-size:.32em;color:var(--gem);text-shadow:none;margin-top:6px;letter-spacing:.2em}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--dim)}
@keyframes deal{from{opacity:.2;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cardbtn,.clsbtn{animation:none}#fade{transition:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand"><span id="tBrand"></span><small>2.5D</small></div>
    <span id="clsChip"></span>
    <div class="stat"><div class="bar"><i id="hpbar"></i></div><span id="hpt">-</span></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      empty:'カードはまだない。採掘レベルが上がるとカードを1枚選べる。',

const MT={

const CARDS=[
  {id:'atk',n:{ja:'剛腕',en:'Heavy Arm'},r:0,d:{ja:'攻撃力+1。',en:'+1 attack.'},f:()=>P.atk++},

  paused=true;mouse.down=false;touchAtk=false;const hand=drawCards(P.cls==='miner'?4:3,e.tier),O=ORE[e.tier],od=oddsFor(e.tier);
  ovRender=()=>{ov.innerHTML=`<div class="overlay"><div class="pick"><h2 style="color:var(--xp)">${ja()?`採掘Lv${e.lv}! カードを選べ`:`Mining Lv${e.lv}! Choose a card`}</h2>
    <p>${ja()?`<b style="color:${O.c}">${O.n}</b>でレベルが上がった。良い鉱石ほどレアなカードが出やすい。持っていけるのは1枚だけ。`:`You levelled up on <b style="color:${O.c}">${O.n}</b>. Better ore means rarer cards. Keep one.`}</p>
    <p class="odds">${[0,1,2].map(r=>`<span style="color:${RC[r]}">${RARS[lang][r]} ${Math.round(od[r]*100)}%</span>`).join('')}</p>
    <div class="hand" style="--n:${hand.length}">${hand.map((c,k)=>`<button class="cardbtn" data-k="${k}" style="--rc:${RC[c.r]}">
      <span class="rar"><span>${RARS[lang][c.r]}${c.cls?(ja()?`・${CLASSES[c.cls].n}専用`:` · ${CLASSES[c.cls].n} only`):''}</span><span>${k+1}</span></span><span class="nm">${c.n}</span><span class="ds">${c.d}</span>
      ${P.deck[c.id]?`<span class="own">${ja()?'所持':'Owned'} ×${P.deck[c.id]}</span>`:''}</button>`).join('')}</div></div></div>`;
    ov.querySelectorAll('.cardbtn').forEach(b=>b.onclick=()=>choose(+b.dataset.k));const f=ov.querySelector('.cardbtn');if(f)f.focus()};
  choose=k=>{const c=hand[k];if(!c)return;c.f();if(!c.once)P.deck[c.id]=(P.deck[c.id]||0)+1;closeOv();paused=false;renderDeck();hud();
    float(P.x,1.4,P.z,c.n,'#fff3b0',true);log(ja()?`「${c.n}」を手に入れた。`:`Took ${c.n}.`,RC[c.r])};
  ovRender();
}
function openStairs(){
  paused=true;mouse.down=false;touchAtk=false;const left=[...map].filter(isBlock).length;
  ovRender=()=>{ov.innerHTML=`<div class="overlay"><div class="card"><h2>${ja()?`B${depth+1}Fへの階段`:`Stairs to floor ${depth+1}`}</h2>
    <p>${ja()?(left?`この階にはまだブロックが${left}個残っている。降りれば、その経験値は手に入らない。`:'この階は掘り尽くした。')+'下の階の敵はもっと強い。'
      :(left?`${left} block${left>1?'s':''} still unbroken here. That's mining XP you'd leave behind.`:'This floor is mined out.')+' Monsters below hit harder.'}</p>
    <div class="row"><button id="stay">${ja()?'残って掘る':'Stay and mine'}</button><button id="down">${ja()?'降りる':'Descend'} ▼</button></div></div></div>`;
    $('#stay').onclick=()=>{closeOv();paused=false;stairLock=true};
    $('#down').onclick=()=>{closeOv();descend()};$('#down').focus()};
  ovRender();
}
function descend(){paused=true;$('#fade').style.opacity=1;
  setTimeout(()=>{depth++;P.hp=Math.min(P.max,P.hp+Math.ceil(P.max*.15));gen();log(ja()?`B${depth}F に到着。敵の気配が濃くなった。`:`Floor ${depth}. The air feels more hostile.`,'var(--lamp)');
    if(depth>best){best=depth;try{localStorage.setItem('deepvein25-best',best)}catch(e){}}$('#fade').style.opacity=0;paused=false},380)}
function die(m){over=true;hud();log(ja()?`${MT[m.ty].n}にやられた…`:`The ${MT[m.ty].n} got you...`,'var(--blood)');
  setTimeout(()=>{paused=true;ovRender=()=>{const nc=Object.values(P.deck).reduce((a,b)=>a+b,0),cn=CLASSES[P.cls].n,bd=Math.max(best,depth);
    ov.innerHTML=`<div class="overlay"><div class="card"><h2>${ja()?`${MT[m.ty].n}にやられた`:`Slain by the ${MT[m.ty].n}`}</h2>
    <p>${ja()?`${cn}・到達 B${depth}F・採掘Lv${P.mlv}・撃破 ${kills}・カード ${nc}枚<br>最深記録: B${bd}F`:`${cn} · floor ${depth} · Mining Lv${P.mlv} · ${kills} kills · ${nc} cards<br>Deepest run: floor ${bd}`}</p>
    <div class="row"><button id="same">${ja()?'同じ職業で再挑戦':'Retry same class'}</button><button id="again">${ja()?'職業を選び直す':'Choose a new class'}</button></div></div></div>`;
    $('#same').onclick=()=>{const c=P.cls;closeOv();newGame(c)};$('#again').onclick=()=>{closeOv();classSelect()};$('#same').focus()};ovRender()},900)}
function openRestart(){if(!P||!inRun||ovRender||over)return;paused=true;mouse.down=false;touchAtk=false;for(const k in keys)keys[k]=false;cancelRs=()=>{closeOv();paused=false};
  ovRender=()=>{const nc=Object.values(P.deck).reduce((a,b)=>a+b,0);
    ov.innerHTML=`<div class="overlay"><div class="card"><h2>${ja()?'リスタートしますか?':'Restart this run?'}</h2>
    <p>${ja()?`いまの進行(${CLASSES[P.cls].n}・B${depth}F・採掘Lv${P.mlv}・カード${nc}枚)は失われる。`:`Your run (${CLASSES[P.cls].n}, floor ${depth}, Mining Lv${P.mlv}, ${nc} card${nc===1?'':'s'}) will be lost.`}</p>
    <div class="row"><button id="rsSame">${ja()?'同じ職業で再挑戦':'Same class'}</button><button id="rsNew">${ja()?'職業を選び直す':'New class'}</button></div>
    <div class="row"><button id="rsNo">${ja()?'続ける':'Keep playing'}</button></div></div></div>`;
    $('#rsSame').onclick=()=>{const c=P.cls;closeOv();newGame(c)};$('#rsNew').onclick=()=>{closeOv();classSelect()};$('#rsNo').onclick=()=>cancelRs();$('#rsNo').focus()};ovRender()}
function applyLang(){const u=UI[lang];document.documentElement.lang=lang;
  $('#tBrand').textContent=u.brand;$('#lFloor').textContent=u.floor;$('#lMlv').textContent=u.mlv;$('#lAtk').textContent=u.atk;$('#lMine').textContent=u.mine;$('#lArm').textContent=u.arm;
  $('#lPot').textContent=u.pot;$('#rsBtn').textContent=u.rs;$('#langBtn').textContent=u.lang;$('#tA').textContent=u.tA;$('#tS').textContent=u.tS;$('#tQ').textContent=u.tQ;$('#keysHelp').innerHTML=u.keys;
  $('#deck').dataset.empty=u.empty;
  $('#clsChip').textContent=inRun?CLASSES[P.cls].n:u.noCls;$('#skName').textContent=inRun?CLASSES[P.cls].sk:u.skill;
  if(inRun)renderDeck();else $('#deck').innerHTML='';
  hud();if(ovRender)ovRender()}

/* ---------- render ---------- */
let last=0,cw=1,ch=1,tmpV,camT;
function resize(){const r=stage.getBoundingClientRect();cw=r.width;ch=r.height;const dpr=Math.min(2,devicePixelRatio||1);
  renderer.setPixelRatio(dpr);renderer.setSize(cw,ch,false);camera.aspect=cw/ch;camera.updateProjectionMatrix();fxc.width=Math.round(cw*dpr);fxc.height=Math.round(ch*dpr);fx.setTransform(dpr,0,0,dpr,0,0)}
function toScreen(x,y,z){tmpV.set(x,y,z).project(camera);return[(tmpV.x+1)/2*cw,(1-tmpV.y)/2*ch,tmpV.z<1]}
function placeSprite(spr,x,y,z,face,extra=0){spr.mesh.position.set(x,y,z);spr.mesh.quaternion.copy(camera.quaternion);spr.mesh.rotateZ(extra);spr.mesh.scale.x=spr.h*(face<0?-1:1);spr.blob.position.set(x,.012,z)}
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000||0);last=now;
  if(P&&!paused)update(dt);
  if(!P){renderer.render(scene,camera);return}
  // the class picker slowly orbits the starting room
  const idle=!inRun?now/4000:0;
  camT.lerp(tmpV.set(P.x,0,P.z),Math.min(1,dt*8));if(camT.distanceTo(tmpV.set(P.x,0,P.z))>6)camT.set(P.x,0,P.z);
  shake*=Math.pow(.004,dt);const sx=(Math.random()-.5)*shake,sz=(Math.random()-.5)*shake;
  if(inRun)camera.position.set(camT.x+sx,10.2,camT.z+6.4+sz);else camera.position.set(camT.x+Math.sin(idle)*6.4,8.5,camT.z+Math.cos(idle)*6.4);
  camera.lookAt(camT.x+sx,0,camT.z-(inRun?.2:0)+sz);
  lamp.position.set(P.x,1.7,P.z);lamp.distance=11+P.light*1.8;lamp.intensity=2.2+Math.sin(now/130)*.08+Math.sin(now/47)*.05;
  flash.intensity*=Math.pow(.004,dt);
  crysL.forEach((l,k)=>{if(l.intensity>0)l.intensity=1.1+Math.sin(now/300+k)*.25});
  // player
  const fl=(P.swing>0?Math.cos(P.swingAng):P.face.x)<0?-1:1;
  const bob=P.moving&&!paused?Math.abs(Math.sin(now/90))*.07:0;
  let tilt=P.swing>0?(P.swing/.16-.5)*.5*-fl:0;if(P.spin>0)tilt=P.spin/.3*Math.PI*2;
  placeSprite(playerSpr,P.x,bob,P.z,fl,tilt);playerSpr.mesh.visible=!(P.inv>0&&P.dash<=0&&Math.floor(now/70)%2)||over;
  playerSpr.mat.emissive.setHex(P.dash>0?0x1f4a36:0x000000);
  for(const m of mons){let y=0;if(m.ai==='bat')y=.45+Math.sin(now/90+m.wob)*.08;
    let sq=0;if(m.ai==='hop'){sq=Math.min(1,Math.hypot(m.hvx,m.hvz)/4.6);y=Math.sin(sq*Math.PI)*.18}
    placeSprite(m.spr,m.x+(m.st==='wind'?(Math.random()-.5)*.08:0),y,m.z,m.face);
    if(m.ai==='hop')m.spr.mesh.scale.y=m.h*(1-sq*.15);
    m.spr.mat.emissive.setHex(m.flash>0||(m.st==='wind'&&Math.floor(now/70)%2)?0xffffff:m.frz>0?0x1f6a7a:m.pois>0?0x2a4a10:0x000000)}
  for(const it of items)placeSprite(it.spr,it.x,.05+Math.sin(now/220+it.x)*.05,it.z,1);
  for(const p of shots)if(p.k==='bomb')placeSprite(p.spr,p.x,p.y,p.z,1,now/80);
  for(const k in blk){const g=blk[k],u=g.userData;if(u.shk>0){u.shk-=dt;g.position.x=u.base.x+(Math.random()-.5)*.08;g.position.z=u.base.z+(Math.random()-.5)*.08}else{g.position.x=u.base.x;g.position.z=u.base.z}
    const f=dmg[k]/mhp[k],s0=ore[k]===3?1:.8;g.scale.setScalar(s0*(1-f*.18))}
  for(const p of parts){if(!paused){p.life-=dt;p.vy-=16*dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.mesh.rotation.x+=p.spin*dt;p.mesh.rotation.z+=p.spin*dt*.7;
    if(p.mesh.position.y<.055){p.mesh.position.y=.055;p.vy*=-.35;p.vx*=.55;p.vz*=.55;p.spin*=.5}if(p.life<.3)p.mesh.scale.setScalar(Math.max(.01,p.life/.3))}}
  for(const p of parts)if(p.life<=0)scene.remove(p.mesh);parts=parts.filter(p=>p.life>0);
  for(const f of fxs){f.t+=dt;const k=f.t/f.life;f.mesh.material.opacity=Math.max(0,(f.slash?.8:1)*(1-k));if(!f.slash)f.mesh.scale.setScalar(f.r*(.3+k*.7))}
  for(const f of fxs)if(f.t>=f.life){scene.remove(f.mesh);f.mesh.geometry.dispose();f.mesh.material.dispose()}fxs=fxs.filter(f=>f.t<f.life);
  renderer.render(scene,camera);
  // 2D overlay: block HP, level locks, monster HP, floating text
  fx.clearRect(0,0,cw,ch);if(!inRun)return;fx.textAlign='center';const font=ja()?'DotGothic16':'"Pixelify Sans"';
  for(const k in blk){const O=ORE[ore[k]];if(!dmg[k]&&P.mlv>=O.req)continue;const x=k%W+.5,z=((k/W)|0)+.5;if(Math.hypot(x-P.x,z-P.z)>9)continue;const[sx2,sy2,ok]=toScreen(x,1.05,z);if(!ok)continue;
    if(dmg[k]){fx.fillStyle='#000';fx.fillRect(sx2-18,sy2,36,5);fx.fillStyle=O.c;fx.fillRect(sx2-18,sy2,36*Math.max(0,1-dmg[k]/mhp[k]),5)}
    if(P.mlv<O.req){fx.font=`13px ${font}, monospace`;fx.fillStyle='#000';fx.fillText('Lv'+O.req,sx2+1,sy2-3);fx.fillStyle='#ff8a7a';fx.fillText('Lv'+O.req,sx2,sy2-4)}}
  for(const m of mons){if(m.hp>=m.max)continue;const[sx2,sy2,ok]=toScreen(m.x,m.h+.15+(m.ai==='bat'?.45:0),m.z);if(!ok)continue;fx.fillStyle='#000';fx.fillRect(sx2-16,sy2,32,4);fx.fillStyle='#d0554f';fx.fillRect(sx2-16,sy2,32*m.hp/m.max,4)}
  for(const f of floats){if(!paused){f.life-=dt*1.2;f.y+=dt*.8}const[sx2,sy2,ok]=toScreen(f.x,f.y,f.z);if(!ok)continue;fx.font=`${f.big?20:15}px ${font}, monospace`;fx.globalAlpha=Math.max(0,Math.min(1,f.life*2));
    fx.fillStyle='#000';fx.fillText(f.t,sx2+1,sy2+1);fx.fillStyle=f.c;fx.fillText(f.t,sx2,sy2)}
  fx.globalAlpha=1;floats=floats.filter(f=>f.life>0);
  if(mouse.on&&!paused){fx.strokeStyle='rgba(224,168,58,.7)';fx.lineWidth=2;fx.beginPath();fx.arc(mouse.sx,mouse.sy,7,0,7);fx.stroke()}
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&cancelRs){cancelRs();return}
  if(choose&&/^[1-4]$/.test(e.key)){choose(+e.key-1);return}
  const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(paused||!P)return;keys[k]=true;
  if(k==='q')drink();if((k==='k'||k==='shift')&&!e.repeat)skillQ='auto';if(k==='r'&&!e.repeat){keys[k]=false;openRestart()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;touchAtk=false});
glc.addEventListener('contextmenu',e=>e.preventDefault());
glc.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=glc.getBoundingClientRect();mouse.sx=e.clientX-r.left;mouse.sy=e.clientY-r.top;mouse.on=true});
glc.addEventListener('pointerleave',()=>{mouse.on=false;mouse.down=false});
glc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||paused||!P)return;const r=glc.getBoundingClientRect();mouse.sx=e.clientX-r.left;mouse.sy=e.clientY-r.top;mouse.on=true;
  if(e.button===2)skillQ='mouse';else if(e.button===0)mouse.down=true});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)mouse.down=false});
$('#skBtn').onclick=()=>{if(!paused&&P)skillQ='auto'};$('#potBtn').onclick=drink;$('#rsBtn').onclick=openRestart;
$('#langBtn').onclick=()=>{lang=ja()?'en':'ja';try{localStorage.setItem('deepvein-lang',lang)}catch(e){}applyLang()};
const joyEl=$('#joy'),knob=$('#knob');let joyId=null;
function joyMove(e){const r=joyEl.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  joy={x:Math.abs(dx)<.15?0:dx,y:Math.abs(dy)<.15?0:dy};knob.style.transform=`translate(${dx*35}px,${dy*35}px)`}
joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;joy={x:0,y:0};knob.style.transform=''};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
const tA=$('#tA');tA.addEventListener('pointerdown',e=>{e.preventDefault();tA.setPointerCapture(e.pointerId);touchAtk=true});['pointerup','pointercancel'].forEach(ev=>tA.addEventListener(ev,()=>touchAtk=false));
$('#tS').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&P)skillQ='auto'});
$('#tQ').addEventListener('pointerdown',e=>{e.preventDefault();drink()});

/* ---------- boot: a live dungeon sits behind the class picker ---------- */
try{
  if(!window.THREE)throw new Error('three');
  initGL();tmpV=new THREE.Vector3();camT=new THREE.Vector3();
  new ResizeObserver(resize).observe(stage);resize();
  newGame('miner',true);classSelect();requestAnimationFrame(frame);
}catch(err){console.error(err);stage.insertAdjacentHTML('beforeend',`<div id="err">${ja()?'3D表示を開始できなかった。WebGLに対応したブラウザで開いてほしい。':'Couldn’t start the 3D view. This example needs a browser with WebGL.'}</div>`);applyLang()}
</script>
